<!DOCTYPE html>
<html>
<head>
  <title>Live Charts</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="{{ url_for('static', filename='js/charts.js') }}"></script>
</head>
<body>
  <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
  <div>
    <label for="moteidSelect">Sensor (moteid)</label><br/>
    <select id="moteidSelect"></select>
  </div>
  <div>
    <label for="windowSelect">Time window</label><br/>
    <select id="windowSelect">
      <option value="5m">Last 5 min</option>
      <option value="15m" selected>Last 15 min</option>
      <option value="1h">Last 1 hour</option>
      <option value="24h">Last 24 hours</option>
    </select>
  </div>
  <div>
    <label for="columnsSelect">Columns</label><br/>
    <select id="columnsSelect" multiple size="4" style="min-width:160px;"></select>
  </div>
  <button id="applyFilters">Apply</button>
</div>

<canvas id="chart" height="400"></canvas>

<!-- Scripts at end -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="{{ url_for('static', filename='js/charts.js') }}"></script>
</body>
</html>
