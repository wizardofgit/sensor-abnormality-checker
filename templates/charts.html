<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Dashboard</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --accent-color: #3182ce;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .controls-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            background-color: #edf2f7;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            user-select: none;
        }

        .toggle-btn:hover {
            background-color: #e2e8f0;
        }

        .toggle-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            box-shadow: 0 2px 4px rgba(49, 130, 206, 0.3);
        }

        select {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-primary);
            background-color: white;
            outline: none;
            transition: border-color 0.2s;
            min-width: 150px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            font-size: 0.95rem;
            align-self: flex-end;
        }

        button:hover {
            background-color: #2c5282;
        }

        button:active {
            transform: scale(0.98);
        }

        .chart-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            height: 600px;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            z-index: 10;
            font-weight: 500;
            color: var(--accent-color);
            display: none;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--accent-color);
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 20px;
            transition: color 0.2s;
            align-self: flex-start;
        }

        .btn-back:hover {
            color: var(--accent-color);
        }
    </style>
</head>

<body>

    <div class="container">
        <a href="/" class="btn-back">&larr; Dashboard</a>
        <header>
            <h1>Sensor Charts</h1>
        </header>

        <div class="controls-card">
            <div class="control-group">
                <label for="moteSelect">Select Mote</label>
                <select id="moteSelect"></select>
            </div>

            <div class="control-group">
                <label>Metrics</label>
                <div class="toggle-group" id="metricToggles">
                    <div class="toggle-btn active" data-value="temperature">Temperature</div>
                    <div class="toggle-btn active" data-value="humidity">Humidity</div>
                    <div class="toggle-btn" data-value="light">Light</div>
                    <div class="toggle-btn" data-value="voltage">Voltage</div>
                </div>
            </div>

            <div class="control-group">
                <label for="resolutionSelect">Resolution</label>
                <select id="resolutionSelect">
                    <option value="raw">Raw Data (All points)</option>
                    <option value="min">1-Minute Average</option>
                    <option value="hour">1-Hour Average</option>
                </select>
            </div>

            <button id="refreshBtn">Update Chart</button>
        </div>

        <div class="chart-card">
            <div id="loading">
                <div class="spinner"></div> Loading data...
            </div>
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

</body>

</html>
