<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Sensor Charts</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        #chart-container {
            width: 100%;
            height: 80vh;
        }
    </style>
</head>

<body>

<h1>Live Charts</h1>

<div>
    <label>Mote ID:</label>
    <select id="moteSelect"></select>

    <label>Columns:</label>
    <select id="columnSelect" multiple>
        <option value="temperature" selected>Temperature</option>
        <option value="humidity">Humidity</option>
        <option value="light">Light</option>
        <option value="voltage">Voltage</option>
    </select>

    <label>Resolution:</label>
    <select id="resolutionSelect">
        <option value="raw">Every reading</option>
        <option value="min">Avg per minute</option>
        <option value="hour">Avg per hour</option>
    </select>

    <button id="refreshBtn">Refresh</button>
</div>

<div id="chart-container">
    <canvas id="chart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<script src="{{ url_for('static', filename='js/charts.js') }}"></script>

</body>
</html>
